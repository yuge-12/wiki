{% extends "encyclopedia/layout.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block body %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>{{ title }}</h1>
        <a href="{% url 'edit_page' title %}" class="btn btn-outline-primary">Edit Page</a>
    </div>
    
    <div class="entry-content">
        {{ content|safe }}
    </div>
{% endblock %}
